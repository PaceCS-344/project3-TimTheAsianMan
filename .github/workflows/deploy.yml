name: Auto-Deploy Portfolio

# 1. This tells GitHub to run this script whenever you push to the 'main' branch
on:
  push:
    branches:
      - main

# 2. This is the list of tasks the virtual machine will perform
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # A. Download your code onto the virtual machine
      - name: Checkout code
        uses: actions/checkout@v3

      # B. Install Node.js so it can run React
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # C. Install your dependencies
      - name: Install dependencies
        run: npm install

      # D. Build the optimized production folder
      - name: Build project
        run: npm run build

      # E. Push the newly built folder to your live GitHub Pages branch
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build